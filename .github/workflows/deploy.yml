name: Deploy Portfolio to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deploy"
        required: false
        default: "Manual trigger"

# Prevent concurrent deployments — never cancel an in-progress deploy
concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  ARTIFACT_NAME: dist-${{ github.sha }}
  CF_PROJECT: shairali-portfolio

# ─────────────────────────────────────────────
# JOB 1 — Build
# ─────────────────────────────────────────────
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline

      # Writes .env.production from the BACKEND_ENV GitHub Secret.
      # Store the full file content (multi-line) as that secret.
      - name: Write .env.production
        run: |
          printf '%s' "$BACKEND_ENV" > .env.production
          echo ".env.production written successfully"
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/
          retention-days: 1
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # JOB 2 — Deploy
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://www.shairali.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Creates the Pages project on the first run only
      - name: Ensure Cloudflare Pages project exists
        run: |
          if ! npx --yes wrangler@4 pages project list | grep -q "$CF_PROJECT"; then
            npx --yes wrangler@4 pages project create "$CF_PROJECT" --production-branch=main
          fi

      # Pushes to main go live; manual runs from other branches become previews
      - name: Deploy to Cloudflare Pages
        run: |
          npx --yes wrangler@4 pages deploy dist \
            --project-name="$CF_PROJECT" \
            --branch="$GITHUB_REF_NAME" \
            --commit-hash="$GITHUB_SHA"

      # ── Summary ───────────────────────────────
      - name: Deployment summary
        if: success()
        run: |
          echo "======================================"
          echo "  Deployed successfully to Cloudflare"
          echo "======================================"
          echo "  URL     : https://www.shairali.com"
          echo "  Project : ${CF_PROJECT}"
          echo "  Commit  : ${{ github.sha }}"
          echo "  Branch  : ${{ github.ref_name }}"
          echo "  Actor   : ${{ github.actor }}"
          echo "  Trigger : ${{ github.event_name }}"
          echo "======================================"
